<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lookout</title><style>
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#0b1220;color:#e6edf7;margin:0;line-height:1.5}
.wrap{max-width:420px;margin:6vh auto;padding:0 1.5rem}
.wrap.wide{max-width:920px}
.card{background:#121a2e;border:1px solid #1f2a44;border-radius:14px;padding:1.6rem}
.logo{font-weight:800;font-size:1.4rem;text-align:center;margin-bottom:1.2rem}
.logo b{color:#6366f1}
h3{margin:.2rem 0 .4rem}
label{display:block;font-size:.82rem;color:#94a3b8;margin:.8rem 0 .3rem}
input,select{width:100%;box-sizing:border-box;background:#0b1220;border:1px solid #1f2a44;border-radius:8px;color:#e6edf7;padding:.6rem .7rem;font:inherit}
.btn{display:block;width:100%;box-sizing:border-box;background:#6366f1;color:#fff;border:none;border-radius:8px;padding:.65rem;font-weight:700;margin-top:1rem;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid #1f2a44;color:#e6edf7;margin-top:.6rem}
.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:.6rem;font-size:.88rem;margin-bottom:1rem}
.muted{color:#94a3b8;font-size:.9rem}
a{color:#818cf8;text-decoration:none}a:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.4rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid #1f2a44;vertical-align:middle}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}
.row{display:flex;gap:.7rem;align-items:center}
code{background:#0b1220;border:1px solid #1f2a44;border-radius:6px;padding:.15rem .4rem;word-break:break-all;font-size:.82rem}
form.inline{display:inline;margin:0}
summary{cursor:pointer;color:#818cf8}select[multiple]{height:auto}</style></head><body>
<div class="wrap wide"><div class="card">
  <div class="bar"><div class="logo" style="margin:0">Look<b>out</b> &middot; Admin</div>
  <div class="row" style="gap:1.1rem;font-size:.9rem;flex-wrap:wrap"><a href="users.html">Users</a><a href="groups.html">Groups</a><a href="departments.html">Departments</a><a href="locations.html">Locations</a><a href="index.html">&larr; Dashboard</a></div></div>
  
  <h3>Users</h3>
  <table>
    <tr><th>Email</th><th>Name</th><th>Role</th><th>MFA</th><th>Status</th><th>Organization</th><th></th></tr>
    
    <tr>
      <td>admin@lookout.app</td>
      <td>Avery Admin</td>
      <td>
        <form class="inline" method="post" action="/admin/users/role">
          <input type="hidden" name="id" value="u1">
          <select name="role" onchange="this.form.submit()"><option value="owner" selected>owner</option><option value="admin" >admin</option><option value="operator" >operator</option><option value="viewer" >viewer</option></select>
        </form>
      </td>
      <td><span style="color:#22c55e">on</span></td>
      <td>active</td>
      <td>
        <details><summary>Edit</summary>
          <form method="post" action="/admin/users/org" style="margin-top:.5rem;min-width:220px">
            <input type="hidden" name="id" value="u1">
            <label>Department</label><select name="department"><option value="">—</option><option value="d1" >Engineering</option><option value="d2" selected>IT Operations</option></select>
            <label>Location</label><select name="location"><option value="">—</option><option value="l1" selected>HQ — Building A</option><option value="l2" >Data Center West</option></select>
            <label>Groups</label><select name="groups" multiple size="3"><option value="g1" >On-call</option><option value="g2" selected>Admins</option></select>
            <button class="btn" type="submit">Save</button>
          </form>
        </details>
      </td>
      <td>
        
        <form class="inline" method="post" action="/admin/users/disable">
          <input type="hidden" name="id" value="u1">
          <input type="hidden" name="disabled" value="true">
          <button class="btn ghost" style="width:auto;margin:0;padding:.3rem .6rem">Disable</button>
        </form>
      </td>
    </tr>
    
    <tr>
      <td>sam@lookout.app</td>
      <td>Sam Operator</td>
      <td>
        <form class="inline" method="post" action="/admin/users/role">
          <input type="hidden" name="id" value="u2">
          <select name="role" onchange="this.form.submit()"><option value="owner" >owner</option><option value="admin" >admin</option><option value="operator" selected>operator</option><option value="viewer" >viewer</option></select>
        </form>
      </td>
      <td>off</td>
      <td>active</td>
      <td>
        <details><summary>Edit</summary>
          <form method="post" action="/admin/users/org" style="margin-top:.5rem;min-width:220px">
            <input type="hidden" name="id" value="u2">
            <label>Department</label><select name="department"><option value="">—</option><option value="d1" selected>Engineering</option><option value="d2" >IT Operations</option></select>
            <label>Location</label><select name="location"><option value="">—</option><option value="l1" selected>HQ — Building A</option><option value="l2" >Data Center West</option></select>
            <label>Groups</label><select name="groups" multiple size="3"><option value="g1" selected>On-call</option><option value="g2" >Admins</option></select>
            <button class="btn" type="submit">Save</button>
          </form>
        </details>
      </td>
      <td>
        
        <form class="inline" method="post" action="/admin/users/disable">
          <input type="hidden" name="id" value="u2">
          <input type="hidden" name="disabled" value="true">
          <button class="btn ghost" style="width:auto;margin:0;padding:.3rem .6rem">Disable</button>
        </form>
      </td>
    </tr>
    
    <tr>
      <td>val@lookout.app</td>
      <td>Val Viewer</td>
      <td>
        <form class="inline" method="post" action="/admin/users/role">
          <input type="hidden" name="id" value="u3">
          <select name="role" onchange="this.form.submit()"><option value="owner" >owner</option><option value="admin" >admin</option><option value="operator" >operator</option><option value="viewer" selected>viewer</option></select>
        </form>
      </td>
      <td>off</td>
      <td>active</td>
      <td>
        <details><summary>Edit</summary>
          <form method="post" action="/admin/users/org" style="margin-top:.5rem;min-width:220px">
            <input type="hidden" name="id" value="u3">
            <label>Department</label><select name="department"><option value="">—</option><option value="d1" >Engineering</option><option value="d2" >IT Operations</option></select>
            <label>Location</label><select name="location"><option value="">—</option><option value="l1" >HQ — Building A</option><option value="l2" >Data Center West</option></select>
            <label>Groups</label><select name="groups" multiple size="3"><option value="g1" >On-call</option><option value="g2" >Admins</option></select>
            <button class="btn" type="submit">Save</button>
          </form>
        </details>
      </td>
      <td>
        
        <form class="inline" method="post" action="/admin/users/disable">
          <input type="hidden" name="id" value="u3">
          <input type="hidden" name="disabled" value="true">
          <button class="btn ghost" style="width:auto;margin:0;padding:.3rem .6rem">Disable</button>
        </form>
      </td>
    </tr>
    
  </table>
  <h3 style="margin-top:1.6rem">Add a user</h3>
  <form method="post" action="/admin/users/create">
    <div class="row" style="flex-wrap:wrap">
      <div style="flex:1;min-width:170px"><label>Email</label><input name="email" type="email" required></div>
      <div style="flex:1;min-width:140px"><label>Name</label><input name="name"></div>
      <div style="min-width:130px"><label>Role</label><select name="role"><option value="owner">owner</option><option value="admin">admin</option><option value="operator">operator</option><option value="viewer">viewer</option></select></div>
    </div>
    <label>Temporary password (leave blank for SSO-only)</label><input name="password" type="password">
    <button class="btn" type="submit">Create user</button>
  </form>
</div></div></body></html>
